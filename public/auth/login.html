<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - FitZone Club</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="container">
        <h1>🏋️ FitZone Club</h1>
        <div class="subtitle">Войдите в свой аккаунт</div>

        <div id="alert" class="alert"></div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.com" autocomplete="email">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password">
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe"> Запомнить меня
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Забыли пароль?</a>
            </div>

            <button type="submit" id="submitBtn" onclick="login()">Войти</button>
        </form>

        <div class="divider">
            <span>или</span>
        </div>

        <div class="links">
            <a href="/auth/register.html">📝 Создать аккаунт</a>
            <a href="/">🏠 На главную</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
