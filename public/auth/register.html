<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - FitZone Club</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="container">
        <h1>🏋️ FitZone Club</h1>
        <div class="subtitle">Создайте новый аккаунт</div>

        <div id="alert" class="alert"></div>

        <form id="registerForm" onsubmit="return false;">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="name" placeholder="Введите ваше имя" autocomplete="name">
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@mail.com" autocomplete="email">
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Минимум 6 символов" autocomplete="new-password">
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button type="submit" id="submitBtn" onclick="register()">Зарегистрироваться</button>
        </form>

        <div class="divider">
            <span>уже есть аккаунт?</span>
        </div>

        <div class="links">
            <a href="/auth/login.html">🔑 Войти в аккаунт</a>
            <a href="/">🏠 На главную</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
